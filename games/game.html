        // ==========================================
        // 4. 猜數字 (Guess Number)
        // ==========================================
        function initGuessGame(container) {
            let target = Math.floor(Math.random() * 100) + 1;
            let attempts = 0;
            let isOver = false;

            container.innerHTML = `
                <div style="max-width: 300px; margin: 0 auto;">
                    <div style="margin-bottom:10px; font-weight:bold;">${t('guessTitle')}</div>
                    <input type="number" id="guess-input" placeholder="${t('guessPlaceholder')}" min="1" max="100" style="margin-bottom: 10px;">
                    <button class="btn-primary" style="width: 100%;" onclick="checkGuess()">${t('guessBtn')}</button>
                    <div id="guess-feedback" style="margin-top:15px; font-size: 17px; font-weight:bold;"></div>
                    <div id="guess-history" style="margin-top:8px; opacity:0.8; font-size:13px;"></div>
                </div>
            `;

            window.checkGuess = function() {
                if (isOver) return;
                const input = document.getElementById('guess-input');
                const feedback = document.getElementById('guess-feedback');
                const history = document.getElementById('guess-history');
                const val = parseInt(input.value);

                if (isNaN(val) || val < 1 || val > 100) {
                    feedback.style.color = 'var(--danger-color)';
                    feedback.innerText = t('guessInvalid');
                    return;
                }

                attempts++;
                history.innerHTML += `#${attempts}: ${val} | `;

                if (val === target) {
                    isOver = true;
                    isGameRunning = false;
                    const score = Math.max(10, (11 - attempts) * 100);
                    updateScore(score);
                    SoundFX.start();
                    feedback.style.color = 'var(--accent-color)';
                    feedback.innerHTML = `${t('guessCorrect')}<strong>${target}</strong>。<br>${attempts}${t('guessAttempts')}${score}${t('guessScorePts')}`;
                    autoSaveScore('guess', score);
                } else if (val < target) {
                    SoundFX.eat();
                    feedback.style.color = 'var(--primary-color)';
                    feedback.innerText = t('guessSmall');
                } else {
                    SoundFX.eat();
                    feedback.style.color = 'var(--primary-color)';
                    feedback.innerText = t('guessBig');
                }
                input.value = '';
                input.focus();
            };

            window.onCurrentGameStart = function() {
                document.getElementById('current-game-time').innerText = t('inProgress');
                const input = document.getElementById('guess-input');
                if (input) input.focus();
            };

            window.onCurrentGameRestart = function() {
                openGame('guess');
            };
        }

        // ==========================================
        // 5. 心算大挑戰 (Math Challenge)
        // ==========================================
        function initMathGame(container) {
            let timeLeft = 30;
            let correctAnswer = 0;

            container.innerHTML = `
                <div id="math-problem" style="font-size: 32px; font-weight: bold; margin: 15px 0;">${t('mathWaiting')}</div>
                <input type="number" id="math-input" placeholder="${t('mathPlaceholder')}" style="max-width: 200px; margin-bottom: 12px;" disabled>
                <div id="math-status" style="font-size: 16px; min-height: 24px;"></div>
            `;

            function generateProblem() {
                const ops = ['+', '-', '*'];
                const op = ops[Math.floor(Math.random() * ops.length)];
                let a = Math.floor(Math.random() * 12) + 1;
                let b = Math.floor(Math.random() * 12) + 1;
                if (op === '-' && a < b) [a, b] = [b, a];

                document.getElementById('math-problem').innerText = `${a} ${op === '*' ? '×' : op} ${b} = ?`;
                if (op === '+') correctAnswer = a + b;
                else if (op === '-') correctAnswer = a - b;
                else correctAnswer = a * b;
            }

            window.onCurrentGameStart = function() {
                const input = document.getElementById('math-input');
                input.disabled = false;
                input.focus();
                generateProblem();

                gameTimer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('current-game-time').innerText = `${timeLeft} s`;
                    if (timeLeft <= 0) {
                        clearInterval(gameTimer);
                        isGameRunning = false;
                        input.disabled = true;
                        document.getElementById('math-status').innerHTML = `<span style="color:var(--accent-color); font-size:18px;">${t('timeUp')}${currentScore}</span>`;
                        autoSaveScore('math', currentScore);
                    }
                }, 1000);
            };

            document.getElementById('math-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && isGameRunning) {
                    const ans = parseInt(this.value);
                    if (ans === correctAnswer) {
                        updateScore(20);
                        SoundFX.eat();
                        this.value = '';
                        generateProblem();
                    } else {
                        SoundFX.die();
                        const status = document.getElementById('math-status');
                        status.innerText = t('mathWrong');
                        status.style.color = "var(--danger-color)";
                        setTimeout(() => { status.innerText = ""; }, 600);
                    }
                }
            });

            window.onCurrentGameRestart = function() {
                openGame('math');
            };
        }

        // ==========================================
        // 6. 反應力測試 (Reflex Test)
        // ==========================================
        function initReflexGame(container) {
            let startTime = 0;
            let isGreen = false;
            let isWaitingClick = false;

            container.innerHTML = `
                <div id="reflex-box" style="width: 100%; height: 260px; background-color: #d63031; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: bold; cursor: pointer; transition: background-color 0.2s;">
                    ${t('reflexWaiting')}
                </div>
                <div id="reflex-result" style="margin-top:15px; font-size: 18px; font-weight: bold;"></div>
            `;

            const box = document.getElementById('reflex-box');

            box.onclick = function() {
                if (!isWaitingClick) return;

                if (isGreen) {
                    const diff = Date.now() - startTime;
                    SoundFX.start();
                    let pts = Math.max(10, Math.round(600 - diff));
                    updateScore(pts);
                    document.getElementById('reflex-result').innerHTML = `${t('reflexSuccess')}<strong>${diff}</strong>${t('reflexSuccessEnd')}${pts}${t('reflexPts')}`;
                    autoSaveScore('reflex', pts);
                    isWaitingClick = false;
                    isGameRunning = false;
                } else {
                    SoundFX.die();
                    document.getElementById('reflex-result').innerHTML = `<span style="color:var(--danger-color);">${t('reflexTooEarly')}</span>`;
                    isWaitingClick = false;
                    isGameRunning = false;
                }
            };

            window.onCurrentGameStart = function() {
                box.style.backgroundColor = '#d63031';
                box.innerHTML = t('reflexFocus');
                document.getElementById('reflex-result').innerText = '';
                isWaitingClick = true;
                isGreen = false;

                const delay = Math.floor(Math.random() * 2500) + 1200;
                setTimeout(() => {
                    if (!isWaitingClick) return;
                    isGreen = true;
                    startTime = Date.now();
                    box.style.backgroundColor = '#00b894';
                    box.innerHTML = t('reflexClickNow');
                }, delay);
            };

            window.onCurrentGameRestart = function() {
                openGame('reflex');
            };
        }

        // ==========================================
        // 7. 記憶翻牌 (Memory Match)
        // ==========================================
        function initMemoryGame(container) {
            const icons = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍍'];
            let cards = [...icons, ...icons].sort(() => 0.5 - Math.random());
            let flipped = [];
            let matched = 0;
            let lock = false;

            let gridHtml = '<div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 420px; margin: 10px auto;">';
            cards.forEach((icon, i) => {
                gridHtml += `
                    <div class="panel-card mem-card" style="height: 80px; display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer; background:#dfe6e9;" onclick="flipMemCard(this, '${icon}')">
                        ❓
                    </div>
                `;
            });
            gridHtml += '</div><div id="memory-status" class="game-status-msg"></div>';
            container.innerHTML = gridHtml;

            window.flipMemCard = function(el, icon) {
                if (!isGameRunning || lock || el.classList.contains('matched') || el.classList.contains('open')) return;

                el.innerText = icon;
                el.style.background = 'white';
                el.classList.add('open');
                flipped.push({ el, icon });

                if (flipped.length === 2) {
                    lock = true;
                    const [c1, c2] = flipped;
                    if (c1.icon === c2.icon) {
                        matched++;
                        updateScore(50);
                        SoundFX.eat();
                        c1.el.classList.add('matched');
                        c2.el.classList.add('matched');
                        c1.el.style.background = '#a29bfe';
                        c2.el.style.background = '#a29bfe';
                        flipped = [];
                        lock = false;

                        if (matched === icons.length) {
                            isGameRunning = false;
                            SoundFX.start();
                            document.getElementById('memory-status').innerHTML = `<span style="color:var(--accent-color);">${t('memoryMatchedAll')}${currentScore}</span>`;
                            autoSaveScore('memory', currentScore);
                        }
                    } else {
                        setTimeout(() => {
                            c1.el.innerText = '❓';
                            c2.el.innerText = '❓';
                            c1.el.style.background = '#dfe6e9';
                            c2.el.style.background = '#dfe6e9';
                            c1.el.classList.remove('open');
                            c2.el.classList.remove('open');
                            flipped = [];
                            lock = false;
                        }, 700);
                    }
                }
            };

            window.onCurrentGameStart = function() {
                document.getElementById('current-game-time').innerText = t('inProgress');
            };

            window.onCurrentGameRestart = function() {
                openGame('memory');
            };
        }

        // ==========================================
        // 8. 剪刀石頭布 (RPS)
        // ==========================================
        function initRpsGame(container) {
            let userScore = 0, compScore = 0;

            container.innerHTML = `
                <div id="rps-result" style="font-size: 20px; font-weight: bold; margin: 15px 0; min-height: 28px;">${t('rpsPrompt')}</div>
                <div style="display:flex; justify-content:center; gap: 15px; margin-bottom: 15px;">
                    <button class="btn-primary" style="font-size: 32px; padding: 15px 20px;" onclick="playRps('rock')">🪨</button>
                    <button class="btn-primary" style="font-size: 32px; padding: 15px 20px;" onclick="playRps('scissors')">✂️</button>
                    <button class="btn-primary" style="font-size: 32px; padding: 15px 20px;" onclick="playRps('paper')">📄</button>
                </div>
                <div style="font-size: 16px;">${t('rpsUserScore')} <strong id="rps-u" style="color:var(--primary-color);">0</strong> VS ${t('rpsCompScore')} <strong id="rps-c" style="color:var(--danger-color);">0</strong></div>
            `;

            window.playRps = function(choice) {
                if (!isGameRunning) return;
                const items = ['rock', 'scissors', 'paper'];
                const comp = items[Math.floor(Math.random() * 3)];
                const res = document.getElementById('rps-result');

                const getChoiceName = (c) => {
                    if (c === 'rock') return t('rpsRock');
                    if (c === 'scissors') return t('rpsScissors');
                    return t('rpsPaper');
                };

                if (choice === comp) {
                    res.innerHTML = `${t('rpsTie')}${getChoiceName(choice)}`;
                } else if (
                    (choice === 'rock' && comp === 'scissors') ||
                    (choice === 'scissors' && comp === 'paper') ||
                    (choice === 'paper' && comp === 'rock')
                ) {
                    userScore++;
                    updateScore(100);
                    SoundFX.eat();
                    res.innerHTML = `<span style="color:var(--accent-color);">${t('rpsWin')}${getChoiceName(choice)}${t('rpsCompOut')}${getChoiceName(comp)}</span>`;
                } else {
                    compScore++;
                    SoundFX.die();
                    res.innerHTML = `<span style="color:var(--danger-color);">${t('rpsLose')}${getChoiceName(choice)}${t('rpsCompOut')}${getChoiceName(comp)}</span>`;
                }

                document.getElementById('rps-u').innerText = userScore;
                document.getElementById('rps-c').innerText = compScore;

                if (userScore >= 2 || compScore >= 2) {
                    isGameRunning = false;
                    const win = userScore >= 2;
                    res.innerHTML += `<br><strong style="font-size:20px; color:${win ? 'var(--accent-color)' : 'var(--danger-color)'}">${win ? t('rpsPlayerWin') : t('rpsCompWin')}</strong>`;
                    autoSaveScore('rps', userScore * 100);
                }
            };

            window.onCurrentGameStart = function() {
                document.getElementById('current-game-time').innerText = t('rpsBestOf3');
            };

            window.onCurrentGameRestart = function() {
                openGame('rps');
            };
        }

    </script>
</body>
</html>
